name: Build

env:
  BUILD_TYPE: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure CMake
        run: bash scripts/linux-configure.sh

      - name: Build MPanel
        run: bash scripts/linux-build.sh

      - name: Prepare Binary
        run: cp build/MPanel dist/MPanel-linux-x86_64

      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          name: MPanel-linux-x86_64
          path: dist/MPanel-linux-x86_64
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Windows Build
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure CMake
        shell: cmd
        run: call scripts\windows-configure.bat

      - name: Build MPanel
        shell: cmd
        run: call scripts\windows-build.bat

      - name: Prepare Binary
        shell: cmd
        run: |
          copy /Y build\MPanel.exe dist\MPanel-windows-x86_64.exe
          if errorlevel 1 exit /b 1

      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          name: MPanel-windows-x86_64
          path: dist\MPanel-windows-x86_64.exe
          if-no-files-found: error
          retention-days: 14