name: Build

env:
  BUILD_TYPE: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux Build
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.prepare.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure CMake
        run: bash scripts/linux-configure.sh

      - name: Build MPanel
        run: bash scripts/linux-build.sh

      - name: Prepare Binary
        id: prepare
        run: |
          set -euo pipefail
          version_output="$(build/MPanel --version)"
          if [[ "$version_output" =~ ^MPanel\ v([0-9][A-Za-z0-9.+:~-]*)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "Could not determine a valid MPanel version from: $version_output" >&2
            exit 1
          fi
          mkdir -p dist
          cp build/MPanel "dist/mpanel-${version}-linux-x86_64"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          name: mpanel-${{ steps.prepare.outputs.version }}-linux-x86_64
          path: dist/mpanel-*
          if-no-files-found: error
          retention-days: 14

  build-linux-deb:
    name: Linux DEB Build
    runs-on: ubuntu-24.04
    needs: [build-linux]

    steps:
      - name: Download Linux Binary
        uses: actions/download-artifact@v5
        with:
          name: mpanel-${{ needs.build-linux.outputs.version }}-linux-x86_64
          path: dist

      - name: Build Debian Package
        run: |
          set -euo pipefail

          binary="$GITHUB_WORKSPACE/dist/mpanel-${{ needs.build-linux.outputs.version }}-linux-x86_64"
          package_dir="$RUNNER_TEMP/mpanel-package"
          chmod +x "$binary"
          version="${{ needs.build-linux.outputs.version }}"
          package_file="$GITHUB_WORKSPACE/dist/mpanel-${version}-linux_debian-amd64.deb"

          if [[ ! "$version" =~ ^[0-9][A-Za-z0-9.+:~-]*$ ]]; then
            echo "Could not determine a valid package version: $version" >&2
            exit 1
          fi

          mkdir -p "$package_dir/DEBIAN" "$package_dir/usr/local/bin"
          install -m 0755 "$binary" "$package_dir/usr/local/bin/mpanel"

          cat > "$package_dir/DEBIAN/control" <<EOF
          Package: mpanel
          Version: $version
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Pratschi <pratschigamer@gmail.com>
          Description: A Service and App for Servers that allows for their easy management.
          EOF

          dpkg-deb --build "$package_dir" "$package_file"

      - name: Upload Debian Package
        uses: actions/upload-artifact@v7
        with:
          name: mpanel-${{ needs.build-linux.outputs.version }}-linux_debian-amd64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Windows Build
    runs-on: windows-2025
    outputs:
      version: ${{ steps.prepare.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure CMake
        shell: cmd
        run: call scripts\windows-configure.bat

      - name: Build MPanel
        shell: cmd
        run: call scripts\windows-build.bat

      - name: Prepare Binary
        id: prepare
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $versionOutput = & .\build\MPanel.exe --version
          if ($versionOutput -notmatch '^MPanel v([0-9][A-Za-z0-9.+:~-]*)$') {
            throw "Could not determine a valid MPanel version from: $versionOutput"
          }
          $version = $Matches[1]
          Copy-Item .\build\MPanel.exe "dist\mpanel-$version-windows-x86_64.exe"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          name: mpanel-${{ steps.prepare.outputs.version }}-windows-x86_64
          path: dist\mpanel-*.exe
          if-no-files-found: error
          retention-days: 14