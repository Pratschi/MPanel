name: Build on Linux & Windows

env:
  BUILD_TYPE: Release

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
      - beta

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build on Ubuntu
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure CMake
        run: bash scripts/linux-configure.sh

      - name: Build MPanel
        run: bash scripts/linux-build.sh

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v7
        with:
          name: MPanel-linux-x86_64
          path: build/MPanel
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build on Windows
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure CMake
        shell: cmd
        run: call scripts\windows-configure.bat

      - name: Build MPanel
        shell: cmd
        run: call scripts\windows-build.bat

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v7
        with:
          name: MPanel-windows-x86_64
          path: build/MPanel.exe
          if-no-files-found: error
          retention-days: 14