name: Build

env:
  BUILD_TYPE: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure CMake
        run: bash scripts/linux-configure.sh

      - name: Build MPanel
        run: bash scripts/linux-build.sh

      - name: Prepare Binary
        run: |
          mkdir -p dist
          cp build/MPanel dist/MPanel-linux-x86_64

      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          name: MPanel-linux-x86_64
          path: dist/MPanel-linux-x86_64
          if-no-files-found: error
          retention-days: 14

  build-linux-deb:
    name: Linux DEB Build
    runs-on: ubuntu-24.04
    needs: [build-linux]

    steps:
      - name: Download Linux Binary
        uses: actions/download-artifact@v5
        with:
          name: MPanel-linux-x86_64
          path: dist

      - name: Build Debian Package
        run: |
          set -euo pipefail

          binary="$GITHUB_WORKSPACE/dist/MPanel-linux-x86_64"
          package_dir="$RUNNER_TEMP/mpanel-package"
          chmod +x "$binary"
          version_output="$("$binary" --version)"
          version="${version_output#MPanel v}"
          package_file="$GITHUB_WORKSPACE/dist/mpanel_${version}_amd64.deb"

          if [[ "$version" == "$version_output" || ! "$version" =~ ^[0-9][A-Za-z0-9.+:~-]*$ ]]; then
            echo "Could not determine a valid package version from: $version_output" >&2
            exit 1
          fi

          mkdir -p "$package_dir/DEBIAN" "$package_dir/usr/local/bin"
          install -m 0755 "$binary" "$package_dir/usr/local/bin/mpanel"

          cat > "$package_dir/DEBIAN/control" <<EOF
          Package: mpanel
          Version: $version
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Pratschi <pratschigamer@gmail.com>
          Description: A Service and App for Servers that allows for their easy management.
          EOF

          dpkg-deb --build "$package_dir" "$package_file"

      - name: Upload Debian Package
        uses: actions/upload-artifact@v7
        with:
          name: MPanel-linux-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Windows Build
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure CMake
        shell: cmd
        run: call scripts\windows-configure.bat

      - name: Build MPanel
        shell: cmd
        run: call scripts\windows-build.bat

      - name: Prepare Binary
        shell: cmd
        run: |
          if not exist dist mkdir dist
          copy /Y build\MPanel.exe dist\MPanel-windows-x86_64.exe
          if errorlevel 1 exit /b 1

      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          name: MPanel-windows-x86_64
          path: dist\MPanel-windows-x86_64.exe
          if-no-files-found: error
          retention-days: 14