name: Publish Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  build-linux:
    name: Build Linux release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build MPanel
        run: cmake --build build --config Release

      - name: Stage Linux binary
        run: |
          mkdir -p dist
          cp build/MPanel dist/MPanel-linux-x86_64

      - name: Upload Linux binary
        uses: actions/upload-artifact@v7
        with:
          name: MPanel-linux-x86_64
          path: dist/MPanel-linux-x86_64
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build Windows release
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build MPanel
        run: cmake --build build --config Release

      - name: Stage Windows binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/MPanel.exe dist/MPanel-windows-x86_64.exe

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: MPanel-windows-x86_64
          path: dist/MPanel-windows-x86_64.exe
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [build-linux, build-windows]

    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: MPanel-*
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "MPanel $GITHUB_REF_NAME" \
            --generate-notes \
            --draft
