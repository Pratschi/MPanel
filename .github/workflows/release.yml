
name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  release:
    name: Build and publish Linux release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Configure CMake
        run: bash scripts/linux-configure.sh

      - name: Build MPanel
        run: bash scripts/linux-build.sh

      - name: Package binary
        run: |
          mkdir -p dist
          tar -czf dist/MPanel-linux-x86_64.tar.gz \
            -C build MPanel

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "MPanel $GITHUB_REF_NAME" \
            --notes "$(cat CURRENT_CHANGELOG.md)" \
            --generate-notes
