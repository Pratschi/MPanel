name: Publish Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  BUILD_TYPE: Release

jobs:
  build-linux:
    name: Linux Build
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.prepare.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure CMake
        run: bash scripts/linux-configure.sh

      - name: Build MPanel
        run: bash scripts/linux-build.sh

      - name: Prepare Binary
        id: prepare
        run: |
          set -euo pipefail
          version_output="$(build/MPanel --version)"
          if [[ "$version_output" =~ ^MPanel\ v([0-9][A-Za-z0-9.+:~-]*)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "Could not determine a valid MPanel version from: $version_output" >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$version" != "$tag_version" ]]; then
            echo "Binary version $version does not match tag version $tag_version" >&2
            exit 1
          fi
          mkdir -p dist
          cp build/MPanel "dist/mpanel-${version}-linux-x86_64"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          name: mpanel-${{ steps.prepare.outputs.version }}-linux-x86_64
          path: dist/mpanel-*
          if-no-files-found: error
          retention-days: 1

  build-linux-deb:
    name: Linux DEB Build
    runs-on: ubuntu-24.04
    needs: [build-linux]

    steps:
      - name: Download Debian Package
        uses: actions/download-artifact@v4
        with:
          name: mpanel-${{ needs.build-linux.outputs.version }}-linux-x86_64
          path: dist

      - name: Build Debian Package
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${PACKAGE_VERSION#v}"
          binary="$GITHUB_WORKSPACE/dist/mpanel-${version}-linux-x86_64"
          package_dir="$RUNNER_TEMP/mpanel-package"
          package_file="$GITHUB_WORKSPACE/dist/mpanel-${version}-linux_debian-amd64.deb"

          if [[ ! "$version" =~ ^[0-9][A-Za-z0-9.+:~-]*$ ]]; then
            echo "Invalid Debian package version: $version" >&2
            exit 1
          fi

          mkdir -p "$package_dir/DEBIAN" "$package_dir/usr/local/bin"
          install -m 0755 "$binary" "$package_dir/usr/local/bin/mpanel"

          cat > "$package_dir/DEBIAN/control" <<EOF
          Package: mpanel
          Version: $version
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Pratschi <pratschigamer@gmail.com>
          Description: A Service and App for Servers that allows for their easy management.
          EOF

          dpkg-deb --build "$package_dir" "$package_file"

      - name: Upload Debian Package
        uses: actions/upload-artifact@v7
        with:
          name: mpanel-${{ needs.build-linux.outputs.version }}-linux_debian-amd64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Windows Build
    runs-on: windows-2025
    outputs:
      version: ${{ steps.prepare.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure CMake
        shell: cmd
        run: call scripts\windows-configure.bat

      - name: Build MPanel
        shell: cmd
        run: call scripts\windows-build.bat

      - name: Prepare Binary
        id: prepare
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $versionOutput = & .\build\MPanel.exe --version
          if ($versionOutput -notmatch '^MPanel v([0-9][A-Za-z0-9.+:~-]*)$') {
            throw "Could not determine a valid MPanel version from: $versionOutput"
          }
          $version = $Matches[1]
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          if ($version -ne $tagVersion) {
            throw "Binary version $version does not match tag version $tagVersion"
          }
          Copy-Item .\build\MPanel.exe "dist\mpanel-$version-windows-x86_64.exe"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          name: mpanel-${{ steps.prepare.outputs.version }}-windows-x86_64
          path: dist\mpanel-*.exe
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs: [build-linux, build-linux-deb, build-windows]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: mpanel-*
          merge-multiple: true

      - name: Prepare release notes
        run: |
          current_tag="$GITHUB_REF_NAME"
          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"

          if [ -n "$previous_tag" ]; then
            printf '[**See the full Commit History here**](https://github.com/Pratschi/MPanel/compare/%s...%s)\n' \
              "$previous_tag" "$current_tag" > release-notes.md
          else
            printf 'No previous tag was found for comparison.\n' > release-notes.md
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "MPanel $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --draft

  publish-apt:
    name: Update APT repository
    runs-on: ubuntu-24.04
    needs: [build-linux, build-linux-deb]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: mpanel-${{ needs.build-linux.outputs.version }}-linux_debian-amd64
          path: dist

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro gnupg

      - name: Import APT signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$APT_SIGNING_KEY"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import

          gpg --batch --list-secret-keys \
            723CF12DB3FE1615E98B26E45C96E6146804991D

      - name: Update APT repository
        env:
          APT_SIGNING_FINGERPRINT: 723CF12DB3FE1615E98B26E45C96E6146804991D
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          apt_dir="$GITHUB_WORKSPACE/.github/pages/apt"
          package_file="$GITHUB_WORKSPACE/dist/mpanel-${version}-linux_debian-amd64.deb"

          test -f "$package_file"
          test -f "$apt_dir/conf/distributions"

          sed -i \
            "s/^SignWith:.*/SignWith: ${APT_SIGNING_FINGERPRINT}/" \
            "$apt_dir/conf/distributions"

          gpg --armor --export "$APT_SIGNING_FINGERPRINT" \
            > "$apt_dir/mpanel-archive.asc"

          reprepro -b "$apt_dir" includedeb stable "$package_file"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .github/pages

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4