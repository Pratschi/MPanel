name: Publish Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  BUILD_TYPE: Release

jobs:
  build-linux:
    name: Linux Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure CMake
        run: bash scripts/linux-configure.sh

      - name: Build MPanel
        run: bash scripts/linux-build.sh

      - name: Prepare Binary
        run: |
          mkdir -p dist
          cp build/MPanel dist/MPanel-linux-x86_64

      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          name: MPanel-linux-x86_64
          path: dist/MPanel-linux-x86_64
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Windows Build
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure CMake
        shell: cmd
        run: call scripts\windows-configure.bat

      - name: Build MPanel
        shell: cmd
        run: call scripts\windows-build.bat

      - name: Prepare Binary
        shell: cmd
        run: |
          if not exist dist mkdir dist
          copy /Y build\MPanel.exe dist\MPanel-windows-x86_64.exe
          if errorlevel 1 exit /b 1

      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          name: MPanel-windows-x86_64
          path: dist\MPanel-windows-x86_64.exe
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs: [build-linux, build-windows]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: MPanel-*
          merge-multiple: true

      - name: Prepare release notes
        run: |
          current_tag="$GITHUB_REF_NAME"
          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"

          if [ -n "$previous_tag" ]; then
            printf '[**See the full Commit History here**](https://github.com/Pratschi/MPanel/compare/%s...%s)\n' \
              "$previous_tag" "$current_tag" > release-notes.md
          else
            printf 'No previous tag was found for comparison.\n' > release-notes.md
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "MPanel $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --draft

  publish-apt:
    name: Update APT repository
    runs-on: ubuntu-24.04
    needs: [build-linux]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: MPanel-linux-x86_64
          path: dist

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro gnupg

      - name: Import APT signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$APT_SIGNING_KEY"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import

          gpg --batch --list-secret-keys \
            723CF12DB3FE1615E98B26E45C96E6146804991D

      - name: Build package and update APT repository
        env:
          APT_SIGNING_FINGERPRINT: 723CF12DB3FE1615E98B26E45C96E6146804991D
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          binary="$GITHUB_WORKSPACE/dist/MPanel-linux-x86_64"
          apt_dir="$GITHUB_WORKSPACE/.github/pages/apt"
          package_dir="$RUNNER_TEMP/mpanel-package"
          package_file="$RUNNER_TEMP/mpanel_${version}_amd64.deb"

          test -f "$binary"
          test -f "$apt_dir/conf/distributions"
          chmod +x "$binary"

          mkdir -p "$package_dir/DEBIAN" "$package_dir/usr/local/bin"
          install -m 0755 "$binary" "$package_dir/usr/local/bin/mpanel"

          cat > "$package_dir/DEBIAN/control" <<EOF
          Package: mpanel
          Version: $version
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Pratschi <pratschigamer@gmail.com>
          Description: A Service and App for Servers that allows for their easy management.
          EOF

          dpkg-deb --build "$package_dir" "$package_file"

          sed -i \
            "s/^SignWith:.*/SignWith: ${APT_SIGNING_FINGERPRINT}/" \
            "$apt_dir/conf/distributions"

          gpg --armor --export "$APT_SIGNING_FINGERPRINT" \
            > "$apt_dir/mpanel-archive.asc"

          reprepro -b "$apt_dir" includedeb stable "$package_file"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .github/pages

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4